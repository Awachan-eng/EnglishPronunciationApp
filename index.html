<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語発音トレーニング</title>
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

    <div class="app">

        <section id="selectScreen">

            <h1>英語発音トレーニング</h1>

            <p class="label">練習する表現を選んでください</p>

            <div id="phraseList" class="phrase-list"></div>

        </section>

        <section id="practiceScreen" hidden>

            <button id="backButton">◀ 表現の選択に戻る</button>

            <p id="phraseLevel" class="level-badge"></p>

            <div class="phrase" id="phrase"></div>

            <p id="phraseJa" class="phrase-ja"></p>

            <p id="phraseFocus" class="phrase-focus"></p>

            <button id="sampleButton">🔊 モデルを聴く</button>

            <button id="recordButton">🎤 認識を開始</button>

            <button id="retryButton">🔄 もう一度練習する</button>

            <p id="status">認識待機中</p>

            <div id="totalScore" class="total-score"></div>

            <div id="result"></div>

            <div id="tips"></div>

        </section>

    </div>

    <script src="script.js?v=10"></script>

</body>
</html>
